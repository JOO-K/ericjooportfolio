<!DOCTYPE html>
<html lang="en">

<head>
  <title>Eric Joo | Creative Tech</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/archivemenu.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <link rel="stylesheet" href="./css/projects.css">
  <link rel="stylesheet" href="./css/archivetoggle.css">
  <link rel="stylesheet" href="./css/hpslide.css">
  <link rel="stylesheet" href="./css/about.css">

  <link rel="icon" type="image/png" href="./images/greendot_favicon.png">

  <!-- Libs -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.4.1/dist/jquery.min.js"></script>
  <script src="https://unpkg.com/p5@1.11.1/lib/p5.min.js"></script>

  <!-- Your app (module) -->

  <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="./js/c2.js"></script> <!-- or c2.min.js; keep the path you use -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Yarndings+12&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Yarndings+20&display=swap" rel="stylesheet">

  <!-- Part loader -->
  <script src="./js/partLoader.js" data-root="./"></script>
  <!-- Loader control helpers (accessible from app.js) -->

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0e111a;
    }

    #showreel-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e111a;
    }

    #showreel-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Ensure navigation stays above video */
    #navigation {
      position: relative;
      z-index: 100000;
    }

    #archivemenu {
      position: relative;
      z-index: 1000;
    }
  </style>

</head>

<body>
  <header id="navigation"></header>
  <div id="archivemenu"></div>

  <div id="showreel-container">
    <!-- Replace YOUR_YOUTUBE_VIDEO_ID with your actual YouTube video ID -->
    <iframe
      id="showreel-video"
      src="https://www.youtube.com/embed/YOUR_YOUTUBE_VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=YOUR_YOUTUBE_VIDEO_ID&controls=1&modestbranding=1&rel=0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

</body>

</html>
