  <!-- Loader control helpers (accessible from app.js) -->
 <script>
    (function () {
      // Create immediately so it's present even if app.js runs first
      const el = document.createElement('div');
      el.id = 'app-loader';
      el.innerHTML = `
        <div class="console-output">
          <div id="console-output"></div>
        </div>
      `;

      // Insert ASAP or on DOMContentLoaded, whichever happens first
      const attach = () => {
        if (!document.body) return false;
        if (!document.getElementById('app-loader')) {
          document.body.appendChild(el);
        }
        return true;
      };
      if (!attach()) {
        document.addEventListener('DOMContentLoaded', attach, { once: true });
      }

      // Utilities
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      let lastProgress = 0;
      let progressBarLine = null;
      let loaderShown = false;

      // Helper to add log line with smooth auto-scroll
      function addLogLine(msg, delay = 0) {
        setTimeout(() => {
          const consoleOutput = document.querySelector('.console-output');
          const output = document.getElementById('console-output');
          if (!output || !consoleOutput) return;

          const line = document.createElement('div');
          line.className = 'console-line';
          line.textContent = msg;
          output.appendChild(line);

          // Auto-scroll during boot (when not yet scrollable)
          if (!consoleOutput.classList.contains('scrollable')) {
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
          }
        }, delay);
      }

      // Update progress bar
      function updateProgressBar(pct) {
        if (!progressBarLine) return;
        const filled = Math.floor(pct / 100 * 30);
        const empty = 30 - filled;
        progressBarLine.textContent = '   [' + '='.repeat(filled) + '>'.repeat(filled < 30 ? 1 : 0) + ' '.repeat(Math.max(0, empty - (filled < 30 ? 1 : 0))) + '] ' + pct + '%';
      }

      // Expose idempotent helpers on window
      window.showLoader = function showLoader() {
        const root = document.getElementById('app-loader');
        if (!root) return;
        if (loaderShown) return; // Only show once
        loaderShown = true;

        root.classList.remove('hidden');

        // Progressive loading with delays - console typewriter style
        let delay = 0;
        const lineDelay = 80; // ms between lines

        // System header
        addLogLine('================================================', delay); delay += lineDelay;
        addLogLine('  ERIC JOO PORTFOLIO v2.1.4 - 2026', delay); delay += lineDelay;
        addLogLine('  Interactive Creative Portfolio System', delay); delay += lineDelay;
        addLogLine('================================================', delay); delay += lineDelay + 100;

        // AZALEA
        addLogLine('', delay); delay += 20;
        addLogLine('>> AZALEA Audio Visualizer', delay); delay += lineDelay + 50;
        addLogLine('▓▓▓▓▓▓░░▒▒▒▒▒▒░░▓▓▓▓▓▓░░▒▒▒▒▒▒░░▓▓▓▓▓▓░░▒▒▒▒▒▒░░▓▓▓▓', delay); delay += lineDelay;
        addLogLine('▓▓░░░░▓▓▓▓░░░░▒▒▒▒▒▒░░▓▓░░░░▓▓▓▓░░░░▒▒▒▒▒▒░░▓▓░░░░▓▓', delay); delay += lineDelay;
        addLogLine('▓▓▒▒▒▒▓▓▓▓▒▒▒▒░░░░▓▓▓▓▓▓▒▒▒▒▓▓▓▓▒▒▒▒░░░░▓▓▓▓▓▓▒▒▒▒▓▓', delay); delay += lineDelay;
        addLogLine('▓▓░░░░▓▓▓▓░░░░▒▒▒▒▒▒░░▓▓░░░░▓▓▓▓░░░░▒▒▒▒▒▒░░▓▓░░░░▓▓', delay); delay += lineDelay;
        addLogLine('▓▓░░░░▓▓▓▓░░░░▒▒▒▒▒▒░░▓▓░░░░▓▓▓▓░░░░▒▒▒▒▒▒░░▓▓░░░░▓▓', delay); delay += lineDelay + 50;
        addLogLine('AZALEA', delay); delay += lineDelay;
        addLogLine('dense signal typography for audiovisual synthesis', delay); delay += lineDelay;
        addLogLine('version 1.3.0 / micro-render / live generative system', delay); delay += lineDelay + 80;

        // Music playlist
        addLogLine('', delay); delay += 20;
        addLogLine('>> Loading audio library...', delay); delay += lineDelay + 50;
        addLogLine('   [1] Ambient Waves - 3:45', delay); delay += lineDelay;
        addLogLine('   [2] Neon Dreams - 4:12', delay); delay += lineDelay;
        addLogLine('   [3] Digital Rain - 3:58', delay); delay += lineDelay;
        addLogLine('   [4] Silicon Valley - 4:33', delay); delay += lineDelay;
        addLogLine('   [5] Crystal Lattice - 3:27', delay); delay += lineDelay;
        addLogLine('   [6] Vapor Trail - 4:01', delay); delay += lineDelay;
        addLogLine('   [7] Midnight Code - 3:54', delay); delay += lineDelay;
        addLogLine('   [8] Cyber Noir - 4:18', delay); delay += lineDelay + 80;

        // HOMER
        addLogLine('', delay); delay += 20;
        addLogLine('>> HOMER Project Archive', delay); delay += lineDelay + 50;
        addLogLine('   _______   _______   _______    _______   _______ ', delay); delay += lineDelay;
        addLogLine(' ╱    ╱  ╲╲╱       ╲╲╱       ╲╲╱╱       ╲╱╱       ╲', delay); delay += lineDelay;
        addLogLine('╱        ╱╱        ╱╱        ╱╱╱        ╱╱        ╱', delay); delay += lineDelay;
        addLogLine('╱         ╱         ╱         ╱        _╱        _╱ ', delay); delay += lineDelay;
        addLogLine('╲___╱____╱╲________╱╲__╱__╱__╱╲________╱╲____╱___╱', delay); delay += lineDelay + 50;
        addLogLine('Work archive & project navigation', delay); delay += lineDelay + 80;

        // ARGOS joystick
        addLogLine('', delay); delay += 20;
        addLogLine('>> ARGOS Input Controller', delay); delay += lineDelay + 50;
        addLogLine('   __      _', delay); delay += lineDelay;
        addLogLine('o\'\')}_____//', delay); delay += lineDelay;
        addLogLine(' `_/      )', delay); delay += lineDelay;
        addLogLine(' (_(_/-(_/', delay); delay += lineDelay + 50;
        addLogLine('ARGOS - Adaptive Real-time Gesture-based Operating System', delay); delay += lineDelay;
        addLogLine('Joystick interface initialized', delay); delay += lineDelay + 80;

        // Final messages - emphasize website assets
        addLogLine('', delay); delay += 20;
        addLogLine('>> Portfolio assets loaded successfully', delay); delay += lineDelay;
        addLogLine('   5 visual effects ready', delay); delay += lineDelay;
        addLogLine('   8 audio tracks available', delay); delay += lineDelay;
        addLogLine('   ARGOS navigation active', delay); delay += lineDelay;
        addLogLine('   HOMER projects online', delay); delay += lineDelay + 100;
        addLogLine('', delay); delay += 20;
        addLogLine('>> Welcome to the portfolio', delay); delay += lineDelay;
        addLogLine('   Interact with effects via ARGOS joystick', delay); delay += lineDelay;
        addLogLine('   Browse projects via HOMER menu', delay); delay += lineDelay + 100;
        addLogLine('', delay); delay += 20;
        addLogLine('░▒▓ Website loaded ▓▒░', delay); delay += lineDelay;
        addLogLine('================================================', delay); delay += lineDelay + 100;
        addLogLine('', delay); delay += 20;
        addLogLine(' ▄▀▀█▄▄▄▄       ▄█ ', delay); delay += lineDelay;
        addLogLine('▐  ▄▀   ▐ ▄▀▀▀█▀ ▐ ', delay); delay += lineDelay;
        addLogLine('  █▄▄▄▄▄ █    █    ', delay); delay += lineDelay;
        addLogLine('  █    ▌ ▐    █    ', delay); delay += lineDelay;
        addLogLine(' ▄▀▄▄▄▄▄    ▄   ▀▄  ', delay); delay += lineDelay;
        addLogLine(' █    ▐     ▀▀▀▀   ', delay); delay += lineDelay;
        addLogLine(' ▐', delay); delay += lineDelay + 100;

        // Enable scrolling after boot sequence completes
        setTimeout(() => {
          const consoleOutput = document.querySelector('.console-output');
          if (consoleOutput) {
            consoleOutput.classList.add('scrollable');
          }
        }, delay);
      };

      window.setLoaderProgress = function setLoaderProgress(pct) {
        const prog = clamp(Math.round(pct ?? 0), 0, 100);
        if (prog <= lastProgress) return;
        lastProgress = prog;

        // Just update the progress bar
        if (progressBarLine) {
          updateProgressBar(prog);
        }
      };

      window.hideLoader = function hideLoader() {
        const root = document.getElementById('app-loader');
        if (!root) return;

        // Ensure minimum display time
        const minDisplayTime = 1500;
        const elapsed = Date.now() - (window._loaderStartTime || 0);
        const remainingTime = Math.max(0, minDisplayTime - elapsed);

        setTimeout(() => {
          // On mobile, fade away after typing completes
          const isMobile = window.innerWidth <= 800;

          if (isMobile) {
            // Wait a moment after boot sequence, then fade out
            setTimeout(() => {
              root.style.transition = 'opacity 1s ease';
              root.style.opacity = '0';
              setTimeout(() => {
                root.classList.add('hidden');
              }, 1000);
            }, 800);
          } else {
            // Desktop: just hide it immediately
            root.classList.add('hidden');
          }

          // Remove initial-load class after content fade-in completes
          setTimeout(() => {
            document.body.classList.remove('initial-load');
          }, 1000);
        }, remainingTime);
      };

      // Track when loader starts showing
      window._loaderStartTime = Date.now();

      // Auto-show the loader when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => window.showLoader());
      } else {
        // DOM already loaded
        window.showLoader();
      }
    })();
  </script>
</head>
<body class="homepage initial-load">
  <!-- headeractivate -->
  <header id="navigation">.</header>
  <div id="archivemenu">.</div>
  <div class="hp-typewriter" id="hp-typewriter">.</div>

  <script>
    const app = document.getElementById('hp-typewriter');
    const typewriter = new Typewriter(app, { loop: false, delay: 5 });
    typewriter
      .pauseFor(0)
      .typeString('Eric Joo (Kyung Hyun) is a Creative Technologist working with Generative AI workflows and Real-Time systems.')
      .pauseFor(100)
      .start();
  </script>
</body>
</html>
